name: Clast Publish

# Orchestrated build + publish of all 12 Clast.* packages to NuGet.org.
# Checks out the whole closure (this repo + gax-dotnet + grpc-dotnet + google-cloud-dotnet) as siblings so the cross-repo
# ProjectReferences resolve, packs every shippable project with -p:Clast=true (renamed assemblies + Clast.snk),
# then pushes to NuGet.org.
#
# VERSIONING: each Clast.* package publishes at the SAME version as the Google/gRPC package it mirrors,
# so a consumer can swap the id (Google.X -> Clast.Google.X) and keep the version — a drop-in AOT build.
# That version comes from each project's own <Version> (the sync keeps it at the upstream NuGet release),
# NOT from a single unified number. We deliberately DO NOT pass a global -p:Version: a global property
# propagates into referenced projects and would rewrite the inter-package dependency versions too
# (e.g. Storage.v1 1.75.0.4193 depends on Google.Apis 1.75.0, not 1.75.0.4193). Per-csproj <Version> is
# project-local, so both the package version and its dependency versions come out correct. A guard below
# refuses to publish a placeholder/prerelease version (e.g. grpc's committed 2.x-dev), which would mean a
# source repo's <Version> wasn't pinned to its upstream NuGet release.
#
# Trigger (the tag/label only names the run + artifact bundle; it does NOT set package versions):
#   - push a tag like v2026.07.15  -> packs each package at its own upstream version and pushes.
#   - manual run (workflow_dispatch) -> dry_run=true (default) packs without pushing.
#
# AUTH: NuGet.org trusted publishing (OIDC) — no long-lived API key secret. The job requests a GitHub OIDC
# token (id-token: write) and NuGet/login exchanges it for a short-lived (~1h) API key. nuget.org accepts it
# only because the trusted-publishing policy on the curt_hagenlocher account matches
# clast-project/google-api-dotnet-client + clast-publish.yml — renaming this file breaks that match.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      label:
        description: 'Run label for the artifact bundle (does NOT set package versions; those mirror upstream)'
        required: false
        default: 'manual'
      dry_run:
        description: 'Pack only; do not push to NuGet.org'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write   # OIDC token for NuGet trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout google-api-dotnet-client (driver)
        uses: actions/checkout@v6
        with:
          path: google-api-dotnet-client

      # Resolve the dependency repos to the same branch this workflow runs on if it exists there (lets a branch
      # dry-run before merge); otherwise main. A tag (e.g. v0.1.0) isn't a branch name, so it falls back to main.
      - name: Resolve dependency refs
        id: dep
        shell: bash
        run: |
          NAME="${{ github.ref_name }}"
          resolve() {
            local repo="$1" ref="main"
            if [ -n "$NAME" ] && git ls-remote --exit-code --heads \
              "https://github.com/clast-project/$repo.git" "$NAME" >/dev/null 2>&1; then
              ref="$NAME"
            fi
            echo "$ref"
          }
          echo "gax=$(resolve gax-dotnet)" >> "$GITHUB_OUTPUT"
          echo "gcloud=$(resolve google-cloud-dotnet)" >> "$GITHUB_OUTPUT"
          echo "grpc=$(resolve grpc-dotnet)" >> "$GITHUB_OUTPUT"

      - name: Checkout gax-dotnet
        uses: actions/checkout@v6
        with:
          repository: clast-project/gax-dotnet
          ref: ${{ steps.dep.outputs.gax }}
          path: gax-dotnet

      - name: Checkout grpc-dotnet
        uses: actions/checkout@v6
        with:
          repository: clast-project/grpc-dotnet
          ref: ${{ steps.dep.outputs.grpc }}
          path: grpc-dotnet

      - name: Checkout google-cloud-dotnet
        uses: actions/checkout@v6
        with:
          repository: clast-project/google-cloud-dotnet
          ref: ${{ steps.dep.outputs.gcloud }}
          path: google-cloud-dotnet

      - name: Setup .NET (8 runtime for tests, 10 SDK per global.json)
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Determine run label
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            L="${GITHUB_REF_NAME#v}"
          else
            L="${{ github.event.inputs.label }}"
          fi
          echo "label=$L" >> "$GITHUB_OUTPUT"
          echo "Run label (artifact naming only; package versions mirror upstream): $L"

      - name: Pack all 12 Clast.* packages (each at its own upstream version)
        shell: bash
        env:
          KEY: ${{ github.workspace }}/google-api-dotnet-client/Clast.snk
          OUT: ${{ github.workspace }}/clast-packages
        run: |
          set -e
          projects=(
            google-api-dotnet-client/Src/Support/Google.Apis.Core/Google.Apis.Core.csproj
            google-api-dotnet-client/Src/Support/Google.Apis/Google.Apis.csproj
            google-api-dotnet-client/Src/Support/Google.Apis.Auth/Google.Apis.Auth.csproj
            google-api-dotnet-client/Src/Generated/Google.Apis.Storage.v1/Google.Apis.Storage.v1.csproj
            google-api-dotnet-client/Src/Generated/Google.Apis.Bigquery.v2/Google.Apis.Bigquery.v2.csproj
            grpc-dotnet/src/Grpc.Auth/Grpc.Auth.csproj
            gax-dotnet/Google.Api.Gax/Google.Api.Gax.csproj
            gax-dotnet/Google.Api.Gax.Rest/Google.Api.Gax.Rest.csproj
            gax-dotnet/Google.Api.Gax.Grpc/Google.Api.Gax.Grpc.csproj
            google-cloud-dotnet/apis/Google.Cloud.Storage.V1/Google.Cloud.Storage.V1/Google.Cloud.Storage.V1.csproj
            google-cloud-dotnet/apis/Google.Cloud.BigQuery.V2/Google.Cloud.BigQuery.V2/Google.Cloud.BigQuery.V2.csproj
            google-cloud-dotnet/apis/Google.Cloud.BigQuery.Storage.V1/Google.Cloud.BigQuery.Storage.V1/Google.Cloud.BigQuery.Storage.V1.csproj
          )
          for p in "${projects[@]}"; do
            # Resolve the project's own <Version> (no global -p:Version — see header comment) and
            # refuse to publish a placeholder/prerelease, which would mean this repo's <Version>
            # wasn't pinned to its upstream NuGet release (e.g. grpc-dotnet's committed 2.x-dev).
            v=$(dotnet msbuild "$p" -getProperty:Version -p:Clast=true -nologo | tr -d '[:space:]')
            case "$v" in
              ''|*-*)
                echo "::error::$(basename "$p" .csproj) resolves to non-stable version '$v'; pin its <Version> to the upstream NuGet release before publishing."
                exit 1 ;;
            esac
            echo "packing $(basename "$p" .csproj) @ $v"
            dotnet pack "$p" -c Release -o "$OUT" -p:Clast=true -p:ClastKeyPath="$KEY"
          done
          ls -l "$OUT"

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: clast-packages-${{ steps.ver.outputs.label }}
          path: ${{ github.workspace }}/clast-packages/*.nupkg

      - name: NuGet login (trusted publishing)
        id: nuget-login
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        uses: NuGet/login@v1
        with:
          user: curt_hagenlocher

      - name: Push to NuGet.org
        if: ${{ github.event_name == 'push' || github.event.inputs.dry_run == 'false' }}
        shell: bash
        run: |
          dotnet nuget push "${{ github.workspace }}/clast-packages/*.nupkg" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
